<!DOCTYPE html>
<html>
<head>
  <title>Product Catalog</title>
</head>
<body>
  <h1>Online Store - Product Catalog</h1>
  <table border="1">
    <tr>
      <th>Product Name</th>
      <th>Description</th>
      <th>Image</th>
      <th>Price</th>
      <th>Availability</th>
    </tr>
    <tr>
      <td rowspan="2">Smartphone</td>
      <td>Latest Android phone</td>
      <td><img src="phone.jpg" alt="Smartphone" width="100"></td>
      <td>₹25,000</td>
      <td>In Stock</td>
    </tr>
    <tr>
      <td colspan="4">Includes charger and earphones</td>
    </tr>
    <tr>
      <td>Laptop</td>
      <td>High-performance laptop</td>
      <td><img src="laptop.jpg" alt="Laptop" width="100"></td>
      <td>₹55,000</td>
      <td>Out of Stock</td>
    </tr>
  </table>
</body>
</html>
