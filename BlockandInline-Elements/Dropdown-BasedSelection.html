<!DOCTYPE html>
<html>
<head>
  <title>Travel Preferences</title>
</head>
<body>
  <h1>Select Your Travel Preferences</h1>

  <form>
    <label for="country">Country:</label>
    <select id="country">
      <option selected>India</option>
      <option>USA</option>
      <option>Japan</option>
    </select><br><br>

    <label for="state">State:</label>
    <select id="state">
      <option selected>Uttar Pradesh</option>
      <option>Maharashtra</option>
      <option>Kerala</option>
    </select><br><br>

    <label for="city">City:</label>
    <select id="city">
      <option selected>Agra</option>
      <option>Lucknow</option>
      <option>Kanpur</option>
    </select><br><br>

    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
      <option selected>Taj Mahal</option>
      <option>Gateway of India</option>
      <option>Qutub Minar</option>
    </select>
  </form>

  <p>You selected: India → Uttar Pradesh → Agra → Taj Mahal</p>
</body>
</html>
