<!-- Question 10: Complete Webpage Layout -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome to Jagdish Web</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  
  <header>
    <nav>
      <ul>
        <li><a href="#hero">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>


  <section id="hero">
    <div class="hero-text">
      <h1>Welcome to Jagdish Web</h1>
      <p>Modular. Accessible. Beautiful.</p>
    </div>
  </section>


  <section id="about">
    <div class="about-container">
      <div class="about-text">
        <h2>About Me</h2>
        <p>I build modular, annotated HTML/CSS layouts for students and educators.</p>
      </div>
      <div class="about-img">
        <img src="profile.jpg" alt="Jagdish Profile" />
      </div>
    </div>
  </section>


  <section id="services">
    <h2>Services</h2>
    <div class="service-boxes">
      <div class="box">HTML Templates</div>
      <div class="box">CSS Styling</div>
      <div class="box">Responsive Layouts</div>
    </div>
  </section>


  <section id="contact">
    <h2>Contact Me</h2>
    <form>
      <input type="text" placeholder="Your Name" required />
      <input type="email" placeholder="Your Email" required />
      <textarea placeholder="Your Message" rows="5" required></textarea>
      <button type="submit">Send</button>
    </form>
  </section>


  <footer>
    <p>&copy; 2025 Jagdish Web. All rights reserved.</p>
  </footer>

</body>
</html>
