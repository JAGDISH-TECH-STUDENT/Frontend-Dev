<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Custom Blog</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">
  <style>
    :root {
      --bs-primary: #6c63ff;
      --bs-font-sans-serif: 'Poppins', sans-serif;
    }
  </style>
</head>
<body>
<div class="container my-5">
  <header class="text-center mb-4">
    <h1 class="text-primary">My Custom Blog</h1>
    <button class="btn btn-primary">Subscribe</button>
  </header>

  <div class="row">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title text-primary">Post One</h5>
          <p class="card-text">This is a sample blog post.</p>
          <button class="btn btn-primary">Read More</button>
        </div>
      </div>
    </div>
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title text-primary">Post Two</h5>
          <p class="card-text">Another sample blog post.</p>
          <button class="btn btn-primary">Read More</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center mt-5">
    <p class="text-muted">© 2025 My Blog</p>
  </footer>
</div>
</body>
</html>
