<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Notifications Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
  <div class="card p-3">
    <div class="alert alert-success">New message received!</div>
    <div class="alert alert-info"> Tip: Update your profile.</div>
    <div class="alert alert-danger"> Warning: Password expiring soon.</div>

    <div class="alert alert-warning alert-dismissible fade show" role="alert">
      Temporary notice!
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="bg-light p-3 border rounded">
      <h5>Summary</h5>
      <p>You have 3 active notifications.</p>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
