<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pricing Plans</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .card:hover { transform: scale(1.05); transition: 0.3s; }
  </style>
</head>
<body>
<div class="container my-5">
  <div class="row">
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Basic</h5>
          <p class="card-text">$10/month</p>
          <ul><li>1 User</li><li>Email Support</li></ul>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card bg-primary text-white shadow-lg">
        <div class="card-body">
          <h5 class="card-title">Pro</h5>
          <p class="card-text">$30/month</p>
          <ul><li>5 Users</li><li>Priority Support</li></ul>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5 class="card-title">Enterprise</h5>
          <p class="card-text">$50/month</p>
          <ul><li>Unlimited Users</li><li>Dedicated Manager</li></ul>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
