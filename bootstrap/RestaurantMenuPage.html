<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Menu</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container my-5">
  <h2 class="text-center lead">Today's Menu</h2>


  <figure class="text-center">
    <img src="food.jpg" class="img-fluid" alt="Delicious Dish">
    <figcaption class="lead">Chef's Signature Dish</figcaption>
  </figure>

 
  <table class="table table-striped text-center">
    <thead class="table-dark">
      <tr>
        <th>Category</th>
        <th>Item</th>
        <th>Price</th>
      </tr>
    </thead>
    <tbody>
      <tr><td>Starter</td><td>Tomato Soup</td><td>$5</td></tr>
      <tr><td>Main</td><td>Grilled Chicken</td><td>$12</td></tr>
      <tr><td>Dessert</td><td>Chocolate Cake</td><td>$6</td></tr>
    </tbody>
  </table>


  <h4 class="mt-4">Chef's Specials</h4>
  <ul class="list-group">
    <li class="list-group-item">Spicy Lamb Curry</li>
    <li class="list-group-item">Seafood Paella</li>
  </ul>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
