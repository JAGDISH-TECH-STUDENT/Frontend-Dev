<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Border and Padding Demo</title>
  <link rel="stylesheet" href="q1-borders-padding.css" />
</head>
<body>
  <header>
    <h1>Border Styles and Padding</h1>
  </header>
  <main class="box-container">
    <section class="box solid">Solid Border</section>
    <section class="box dashed">Dashed Border</section>
    <section class="box double">Double Border</section>
    <section class="box groove">Groove Border</section>
  </main>
  <footer>
    <p>Hover over boxes to see border color transition.</p>
  </footer>
</body>
</html>
