<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadows and Depth</title>
  <link rel="stylesheet" href="q4-shadows-depth.css" />
</head>
<body>
  <header>
    <h1>CSS Shadows and Depth Effects</h1>
  </header>

  <main class="card-container">
    <section class="card shadow-light">
      <h2>Light Shadow</h2>
      <p>This card uses a subtle shadow for soft depth.</p>
    </section>
    <section class="card shadow-medium">
      <h2>Medium Shadow</h2>
      <p>This card has a more noticeable shadow for contrast.</p>
    </section>
    <section class="card shadow-strong">
      <h2>Strong Shadow</h2>
      <p>This card uses a deep shadow for strong emphasis.</p>
    </section>
  </main>

  <footer>
    <p>Hover over cards to see lift effect.</p>
  </footer>
</body>
</html>
