<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Transformations</title>
  <link rel="stylesheet" href="q6-transformations.css" />
</head>
<body>
  <header>
    <h1>CSS Transformations Showcase</h1>
  </header>

  <main class="transform-container">
    <section class="transform-box rotate">
      <p>Rotate</p>
    </section>
    <section class="transform-box scale">
      <p>Scale</p>
    </section>
    <section class="transform-box translate">
      <p>Translate</p>
    </section>
    <section class="transform-box skew">
      <p>Skew</p>
    </section>
  </main>

  <footer>
    <p>Hover over each box to see the transformation effect</p>
  </footer>
</body>
</html>
