<!DOCTYPE html>
<html>
<head>
  <title>Upload Image</title>
</head>
<body>
  <h1>Upload Your Image</h1>
  <form>
    <input type="file" name="image" accept=".jpg, .png" required><br><br>
    <p>Only .jpg and .png files are allowed.</p>
    <input type="submit" value="Upload">
  </form>
</body>
</html>
