<!DOCTYPE html>
<html>
<head>
  <title>Payment Form</title>
</head>
<body>
  <h1>Secure Payment</h1>
  <form>
    Cardholder Name: <input type="text" name="name" required><br><br>
    Card Number: <input type="text" name="card" required><br><br>
    Expiry Date: <input type="month" name="expiry" required><br><br>
    CVV: <input type="password" name="cvv" required><br><br>
    <input type="submit" value="Pay Now">
  </form>
</body>
</html>
