<!DOCTYPE html>
<html>
<head>
  <title>Secure Form</title>
</head>
<body>
  <h1>Secure Input Form</h1>
  <form autocomplete="off">
    Username: <input type="text" required><br><br>
    Password: <input type="password" required><br><br>
    <input type="submit" value="Login">
  </form>

  <p><em>Note: Turning off autocomplete prevents browsers from storing sensitive data like passwords.</em></p>
</body>
</html>
