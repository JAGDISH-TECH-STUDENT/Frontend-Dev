<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Image Filter Gallery</title>
  <link rel="stylesheet" href="Q1-filter-gallery.css" />
</head>
<body>
  <section class="gallery">
    <figure class="blur"><img src="img1.jpg" alt="Blur"><figcaption>Blur</figcaption></figure>
    <figure class="grayscale"><img src="img2.jpg" alt="Grayscale"><figcaption>Grayscale</figcaption></figure>
    <figure class="sepia"><img src="img3.jpg" alt="Sepia"><figcaption>Sepia</figcaption></figure>
    <figure class="brightness"><img src="img4.jpg" alt="Brightness"><figcaption>Brightness</figcaption></figure>
    <figure class="contrast"><img src="img5.jpg" alt="Contrast"><figcaption>Contrast</figcaption></figure>
    <figure class="hue"><img src="img6.jpg" alt="Hue Rotate"><figcaption>Hue Rotate</figcaption></figure>
  </section>
</body>
</html>
