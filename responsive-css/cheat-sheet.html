<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CSS Cheat Sheet</title>
  <link rel="stylesheet" href="cheat-sheet.css" />
</head>
<body>
  <section class="cheat-sheet">
    <div class="box"><h3>Filters</h3><p>filter: blur(5px);</p></div>
    <div class="box"><h3>Media Queries</h3><p>@media (max-width: 600px)</p></div>
    <div class="box"><h3>Typography</h3><p>font-size: clamp(1rem, 2vw, 1.5rem);</p></div>
    <div class="box"><h3>Responsive Design</h3><p>grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));</p></div>
  </section>
</body>
</html>
